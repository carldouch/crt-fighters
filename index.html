<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRT Fighters</title>
    <style>
      :root { --p1: #35e0ff; --p2: #ff3df0; --ink: #ecebff; --dim: #8f8bb5; }
      html, body { margin: 0; height: 100%; background: #06050c; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; letter-spacing: 0.2em; color: var(--dim); text-align: center; }
      #status.error { color: #ff8080; letter-spacing: 0; max-width: 80vw; }
      #hud { position: fixed; inset: 0; pointer-events: none; visibility: hidden; }
      #hud.on { visibility: visible; }

      .bars { position: absolute; top: 18px; left: 24px; right: 24px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: start; }
      .side { display: flex; flex-direction: column; gap: 6px; }
      .side.p2 { align-items: flex-end; }
      .name { font-weight: 800; letter-spacing: 0.18em; font-size: 14px; }
      .p1 .name { color: var(--p1); }
      .p2 .name { color: var(--p2); }
      .bar { position: relative; width: 100%; height: 22px; background: #15132a; border: 2px solid #2e2a55; border-radius: 4px; overflow: hidden; box-shadow: 0 0 18px #0008 inset; }
      .bar i { position: absolute; inset: 0; transform-origin: left center; }
      .p2 .bar i { transform-origin: right center; }
      .bar .trail { background: #ff4d4d; }
      .p1 .bar .fill { background: linear-gradient(90deg, #1b8fbf, var(--p1)); box-shadow: 0 0 14px var(--p1); }
      .p2 .bar .fill { background: linear-gradient(270deg, #b01ca8, var(--p2)); box-shadow: 0 0 14px var(--p2); }
      .side.low .bar .fill { background: #ff6a3d; animation: pulse 0.5s ease-in-out infinite alternate; }
      .side.hit .bar { animation: shake 0.25s ease-out; border-color: #fff; }
      .pips { display: flex; gap: 6px; }
      .pips b { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #4a4580; background: #110f22; }
      .p1 .pips b.won { background: var(--p1); border-color: var(--p1); box-shadow: 0 0 10px var(--p1); }
      .p2 .pips b.won { background: var(--p2); border-color: var(--p2); box-shadow: 0 0 10px var(--p2); }
      .clock { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
      .clock .time { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 16px #8a5cff; }
      .clock .round { font-size: 11px; letter-spacing: 0.25em; color: var(--dim); margin-top: 4px; }

      .banner { position: absolute; top: 24%; left: 0; right: 0; text-align: center; opacity: 0; transform: scale(1.15); transition: opacity 0.12s, transform 0.12s; }
      .banner.on { opacity: 1; transform: scale(1); }
      .banner .title { font-size: clamp(42px, 9vw, 110px); font-weight: 900; font-style: italic; letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 24px #ff3df0, 0 0 48px #8a5cff, 0 4px 0 #2a1060; }
      .banner .sub { margin-top: 6px; font-size: 18px; letter-spacing: 0.12em; color: var(--ink); text-shadow: 0 2px 6px #000; }

      .help { position: absolute; bottom: 14px; left: 24px; right: 24px; display: flex; justify-content: space-between; gap: 24px; font-size: 12px; color: var(--dim); line-height: 1.6; }
      .help .p2 { text-align: right; }
      .help b { color: var(--ink); font-weight: 600; }
      .help .p1 .who { color: var(--p1); font-weight: 800; }
      .help .p2 .who { color: var(--p2); font-weight: 800; }
      .pad { display: none; color: var(--ink); }
      .pad.on { display: inline; }
      .badge { position: absolute; top: 6px; right: 10px; font-size: 10px; letter-spacing: 0.15em; color: var(--dim); }
      .fade { position: absolute; inset: 0; background: #000; opacity: 0; }

      @keyframes pulse { to { filter: brightness(1.6); } }
      @keyframes shake { 0% { transform: translateX(-5px); } 25% { transform: translateX(5px); } 50% { transform: translateX(-3px); } 100% { transform: none; } }
    </style>
  </head>
  <body>
    <div id="hud">
      <header class="bars">
        <div class="side p1"><span class="name">PLAYER 1</span><div class="bar"><i class="trail"></i><i class="fill"></i></div><div class="pips"><b></b><b></b></div></div>
        <div class="clock"><span class="time">60</span><span class="round">ROUND 1</span></div>
        <div class="side p2"><span class="name">PLAYER 2</span><div class="bar"><i class="trail"></i><i class="fill"></i></div><div class="pips"><b></b><b></b></div></div>
      </header>
      <div class="banner"><div class="title"></div><div class="sub"></div></div>
      <footer class="help">
        <div class="p1"><span class="who">P1</span> <b>A D</b> walk · hold <b>A</b> block · <b>U I</b> punch · <b>J K</b> kick · <b>D+K</b> high kick<span class="pad"> · 🎮 pad 1</span></div>
        <div class="p2"><span class="pad">🎮 pad 2 · </span><b>← →</b> walk · hold <b>→</b> block · <b>Num 4 5</b> punch · <b>Num 1 2</b> kick · <b>←+Num 2</b> high kick <span class="who">P2</span><br />no numpad? <b>; '</b> punch · <b>. /</b> kick</div>
      </footer>
      <div class="badge"></div>
      <div class="fade"></div>
    </div>
    <div id="status">LOADING</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
